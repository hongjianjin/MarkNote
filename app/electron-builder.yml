appId: com.jinhjcn.marknote
productName: MarkNote
directories:
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  # NSIS installer (per-user, no admin needed). Building it needs electron-builder's
  # winCodeSign bundle, whose extraction can fail on accounts without symlink privilege —
  # see README "Packaging" for the workaround.
  target:
    - target: nsis
      arch: [x64]
linux:
  target:
    - AppImage
